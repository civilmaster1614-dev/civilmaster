<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resizer | Civil Master Tools</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon: #00ffe7;
      --bg: #02040a;
      --card: #050b1f;
      --border: rgba(0,255,255,.18);
    }
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: radial-gradient(circle at top,#040b20,#000);
      color: #dffcff;
      min-height: 100vh;
    }
    .container {
      max-width: 1100px;
      margin: 40px auto;
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(0,255,255,.08);
      padding: 32px 24px 40px 24px;
      border: 1px solid var(--border);
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      color: var(--neon);
      text-align: center;
      margin-bottom: 18px;
      font-size: 2.2rem;
    }
    .uploader {
      border: 2px dashed var(--neon);
      border-radius: 12px;
      background: #02101a;
      padding: 36px 0;
      text-align: center;
      margin-bottom: 32px;
      cursor: pointer;
      transition: border-color .2s;
    }
    .uploader.dragover {
      border-color: #00bfff;
    }
    .uploader input[type="file"] {
      display: none;
    }
    .uploader span {
      color: #bffcff;
      font-size: 1.1rem;
    }
    .resize-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: space-between;
      align-items: flex-start;
    }
    .preview-area {
      flex: 1 1 420px;
      min-width: 320px;
      background: #000;
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 340px;
      position: relative;
    }
    .preview-area canvas {
      max-width: 100%;
      max-height: 400px;
      border-radius: 8px;
      background: #111;
      box-shadow: 0 0 16px rgba(0,255,255,.08);
    }
    .controls {
      flex: 1 1 320px;
      min-width: 280px;
      background: #02101a;
      border-radius: 10px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 0 16px rgba(0,255,255,.04);
    }
    .form-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .form-row label {
      min-width: 90px;
      color: #bffcff;
      font-size: 1rem;
    }
    .form-row select, .form-row input[type="number"], .form-row input[type="text"] {
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #050b1f;
      color: #dffcff;
      font-size: 1rem;
      width: 90px;
    }
    .form-row input[type="number"] {
      width: 70px;
    }
    .lock-btn {
      background: none;
      border: none;
      color: var(--neon);
      font-size: 1.2rem;
      cursor: pointer;
      margin: 0 4px;
      transition: color .2s;
    }
    .quality-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .quality-row input[type="range"] {
      width: 120px;
    }
    .size-info {
      color: #8fdfe0;
      font-size: 0.98rem;
      margin-bottom: 8px;
    }
    .download-btn {
      margin-top: 18px;
      padding: 14px 36px;
      border-radius: 40px;
      background: linear-gradient(135deg,#00ffe7,#0066ff);
      color: #001;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1rem;
      box-shadow: 0 0 40px rgba(0,255,255,.2);
      border: none;
      cursor: pointer;
      transition: background .2s;
    }
    .download-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    @media (max-width: 900px) {
      .resize-panel {
        flex-direction: column;
        gap: 24px;
      }
      .preview-area, .controls {
        min-width: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Image Resizer</h1>
    <div class="uploader" id="uploader">
      <input type="file" id="fileInput" accept="image/*">
      <span>Drag & drop an image here, or <b>click to upload</b></span>
    </div>
    <div class="resize-panel" style="display:none;" id="resizePanel">
      <div class="preview-area">
        <canvas id="previewCanvas"></canvas>
      </div>
      <div class="controls">
        <div class="form-row">
          <label for="aspectRatio">Aspect ratio</label>
          <select id="aspectRatio">
            <option value="custom">Custom</option>
            <option value="1:1">Instagram (1:1)</option>
            <option value="16:9">YouTube (16:9)</option>
            <option value="4:5">Facebook (4:5)</option>
            <option value="9:16">Snapchat (9:16)</option>
            <option value="2:3">Pinterest (2:3)</option>
            <option value="3:2">Standard (3:2)</option>
          </select>
        </div>
        <div class="form-row">
          <label for="width">Width</label>
          <input type="number" id="width" min="1">
          <button class="lock-btn" id="lockBtn" title="Lock aspect ratio">🔒</button>
          <label for="height">Height</label>
          <input type="number" id="height" min="1">
        </div>
        <div class="quality-row">
          <label for="quality">Quality</label>
          <input type="range" id="quality" min="10" max="100" value="100">
          <span id="qualityValue">100%</span>
        </div>
        <div class="size-info">
          Original size: <span id="originalSize">-</span> | New size: <span id="newSize">-</span>
        </div>
        <button class="download-btn" id="downloadBtn" disabled>Download</button>
      </div>
    </div>
  </div>
  <script>
    // UI Elements
    const uploader = document.getElementById('uploader');
    const fileInput = document.getElementById('fileInput');
    const resizePanel = document.getElementById('resizePanel');
    const previewCanvas = document.getElementById('previewCanvas');
    const aspectRatio = document.getElementById('aspectRatio');
    const widthInput = document.getElementById('width');
    const heightInput = document.getElementById('height');
    const lockBtn = document.getElementById('lockBtn');
    const qualityInput = document.getElementById('quality');
    const qualityValue = document.getElementById('qualityValue');
    const originalSize = document.getElementById('originalSize');
    const newSize = document.getElementById('newSize');
    const downloadBtn = document.getElementById('downloadBtn');

    let img = null;
    let imgFile = null;
    let aspectLocked = true;
    let origWidth = 0, origHeight = 0;
    let lastURL = null;

    // Drag & Drop
    uploader.addEventListener('click', () => fileInput.click());
    uploader.addEventListener('dragover', e => {
      e.preventDefault();
      uploader.classList.add('dragover');
    });
    uploader.addEventListener('dragleave', e => {
      e.preventDefault();
      uploader.classList.remove('dragover');
    });
    uploader.addEventListener('drop', e => {
      e.preventDefault();
      uploader.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        handleFile(e.dataTransfer.files[0]);
      }
    });
    fileInput.addEventListener('change', e => {
      if (fileInput.files && fileInput.files[0]) {
        handleFile(fileInput.files[0]);
      }
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) return;
      imgFile = file;
      const reader = new FileReader();
      reader.onload = function(e) {
        img = new window.Image();
        img.onload = function() {
          origWidth = img.width;
          origHeight = img.height;
          widthInput.value = origWidth;
          heightInput.value = origHeight;
          updateCanvas();
          updateSizeInfo();
          resizePanel.style.display = '';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      originalSize.textContent = formatSize(file.size);
    }

    // Aspect Ratio Presets
    aspectRatio.addEventListener('change', () => {
      if (!img) return;
      if (aspectRatio.value === 'custom') {
        aspectLocked = false;
        lockBtn.textContent = '🔓';
        lockBtn.title = 'Unlock aspect ratio';
      } else {
        aspectLocked = true;
        lockBtn.textContent = '🔒';
        lockBtn.title = 'Lock aspect ratio';
        const [w, h] = aspectRatio.value.split(':').map(Number);
        let newW = origWidth, newH = origHeight;
        if (origWidth / origHeight > w / h) {
          newW = Math.round(origHeight * w / h);
          newH = origHeight;
        } else {
          newH = Math.round(origWidth * h / w);
          newW = origWidth;
        }
        widthInput.value = newW;
        heightInput.value = newH;
        updateCanvas();
      }
    });

    // Lock/Unlock Aspect Ratio
    lockBtn.addEventListener('click', () => {
      aspectLocked = !aspectLocked;
      lockBtn.textContent = aspectLocked ? '🔒' : '🔓';
      lockBtn.title = aspectLocked ? 'Lock aspect ratio' : 'Unlock aspect ratio';
    });

    // Width/Height Change
    widthInput.addEventListener('input', () => {
      if (!img) return;
      let w = parseInt(widthInput.value);
      let h = parseInt(heightInput.value);
      if (aspectLocked && document.activeElement === widthInput) {
        h = Math.round(w * origHeight / origWidth);
        heightInput.value = h;
      }
      updateCanvas();
    });
    heightInput.addEventListener('input', () => {
      if (!img) return;
      let w = parseInt(widthInput.value);
      let h = parseInt(heightInput.value);
      if (aspectLocked && document.activeElement === heightInput) {
        w = Math.round(h * origWidth / origHeight);
        widthInput.value = w;
      }
      updateCanvas();
    });

    // Quality Change
    qualityInput.addEventListener('input', () => {
      qualityValue.textContent = qualityInput.value + '%';
      updateCanvas();
    });

    // Update Canvas
    function updateCanvas() {
      if (!img) return;
      let w = parseInt(widthInput.value);
      let h = parseInt(heightInput.value);
      previewCanvas.width = w;
      previewCanvas.height = h;
      const ctx = previewCanvas.getContext('2d');
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      updateSizeInfo();
      downloadBtn.disabled = false;
    }

    // Download
    downloadBtn.addEventListener('click', () => {
      if (!img) return;
      let quality = parseInt(qualityInput.value) / 100;
      let mime = 'image/jpeg';
      let dataURL = previewCanvas.toDataURL(mime, quality);
      if (lastURL) URL.revokeObjectURL(lastURL);
      let a = document.createElement('a');
      a.href = dataURL;
      a.download = 'resized-image.jpg';
      a.click();
    });

    // Size Info
    function updateSizeInfo() {
      let quality = parseInt(qualityInput.value) / 100;
      let mime = 'image/jpeg';
      let dataURL = previewCanvas.toDataURL(mime, quality);
      let b64len = dataURL.length - (dataURL.indexOf(',') + 1);
      let size = Math.floor(b64len * 3 / 4);
      newSize.textContent = formatSize(size);
    }
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
      return (bytes/1024/1024).toFixed(2) + ' MB';
    }
  </script>
</body>
</html>
